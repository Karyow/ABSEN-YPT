function openModalFoto(src) {
      document.getElementById('modalFotoImg').src = src;
      document.getElementById('modalFoto').classList.remove('hidden');
    }
    function closeModalFoto() {
      document.getElementById('modalFoto').classList.add('hidden');
    }
  </script>

  <!-- SCRIPT ENGINE & FIREBASE REALTIME SYNC -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-YW_cash_fZYvqsQKjTKR9Rfuto7Mmmo",
      authDomain: "ypt-absen-tracker.firebaseapp.com",
      projectId: "ypt-absen-tracker",
      storageBucket: "ypt-absen-tracker.firebasestorage.app",
      messagingSenderId: "805494203970",
      appId: "1:805494203970:web:515f3412194777d99a6fdb",
      measurementId: "G-911XWQY969"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserState = null;
    let activeCameraStream = null;
    let todayLogCache = { masuk: null, pulang: null };
    const HRD_PASSWORD_SECRET = '12345asdfg';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initLiveClock();
    });

    function initLiveClock() {
      function update() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('id-ID') + ' WIB';
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', options);
      }
      update();
      setInterval(update, 1000);
    }

    function switchLoginMode(mode) {
      const btnKaryawan = document.getElementById('btnTabKaryawan');
      const btnHrd = document.getElementById('btnTabHrd');
      const formKaryawan = document.getElementById('formLoginKaryawan');
      const formHrd = document.getElementById('formLoginHrd');

      if (mode === 'karyawan') {
        btnKaryawan.className = "py-2.5 rounded-lg bg-red-600 text-white transition font-space shadow-sm";
        btnHrd.className = "py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-space";
        formKaryawan.classList.remove('hidden');
        formHrd.classList.add('hidden');
      } else {
        btnHrd.className = "py-2.5 rounded-lg bg-slate-900 text-white transition font-space shadow-sm";
        btnKaryawan.className = "py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition font-space";
        formHrd.classList.remove('hidden');
        formKaryawan.classList.add('hidden');
      }
    }

    async function loginKaryawan(e) {
      e.preventDefault();
      const name = document.getElementById('selectNamaKaryawan').value;
      const inputPin = document.getElementById('inputPassKaryawan').value;

      if (!name || inputPin.length !== 4) {
        alert('Pilih nama dan isi PIN 4 angka!');
        return;
      }

      try {
        const userDoc = await db.collection('users').doc(name).get();

        if (!userDoc.exists) {
          await db.collection('users').doc(name).set({ pin: inputPin });
          alert(`PIN 4 angka untuk ${name} berhasil didaftarkan di Cloud Database!`);
          currentUserState = { name: name, role: 'karyawan' };
          onLoginSuccess();
        } else {
          if (userDoc.data().pin === inputPin) {
            currentUserState = { name: name, role: 'karyawan' };
            onLoginSuccess();
          } else {
            alert('PIN salah!');
          }
        }
      } catch (err) {
        alert('Gagal terhubung ke Cloud Database: ' + err.message);
      }
    }

    function loginHrd(e) {
      e.preventDefault();
      if (document.getElementById('inputPassHrd').value === HRD_PASSWORD_SECRET) {
        currentUserState = { name: 'HRD ADMINISTRATOR', role: 'hrd' };
        onLoginSuccess();
      } else {
        alert('Password HRD Salah!');
      }
    }

    function onLoginSuccess() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('userInfoHeader').classList.remove('hidden');
      document.getElementById('userInfoHeader').classList.add('flex');

      document.getElementById('headerUserName').innerText = currentUserState.name;
      document.getElementById('headerUserRole').innerText = currentUserState.role === 'hrd' ? 'HRD Administrator' : 'Karyawan YPT';

      if (currentUserState.role === 'hrd') {
        document.getElementById('karyawanPanel').classList.add('hidden');
        document.getElementById('hrdPanel').classList.remove('hidden');
        subscribeRealtimeHrdLogs();
      } else {
        document.getElementById('karyawanPanel').classList.remove('hidden');
        document.getElementById('hrdPanel').classList.add('hidden');
        document.getElementById('welcomeText').innerText = `Halo, ${currentUserState.name}!`;
        checkTodayStatus();
      }
    }

    function handleLogout() {
      stopCamera();
      currentUserState = null;
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('userInfoHeader').classList.add('hidden');
    }

    async function startCamera(videoId, placeholderId) {
      stopCamera();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, facingMode: "user" } });
        activeCameraStream = stream;
        const video = document.getElementById(videoId);
        video.srcObject = stream;
        video.classList.remove('hidden');
        document.getElementById(placeholderId).classList.add('hidden');
      } catch (err) {
        alert('Gagal membuka kamera: ' + err.message);
      }
    }

    function capturePhoto(videoId, imgPreviewId) {
      const video = document.getElementById(videoId);
      if (!video || video.classList.contains('hidden')) return alert('Buka kamera terlebih dahulu!');
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = (video.videoHeight / video.videoWidth) * 640 || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = document.getElementById(imgPreviewId);
      img.src = canvas.toDataURL('image/jpeg', 0.6);
      img.classList.remove('hidden');
      video.classList.add('hidden');
      stopCamera();
    }

    function stopCamera() {
      if (activeCameraStream) {
        activeCameraStream.getTracks().forEach(track => track.stop());
        activeCameraStream = null;
      }
    }

    async function checkTodayStatus() {
      const dateKey = new Date().toISOString().split('T')[0];
      const snapshot = await db.collection('absen_logs')
        .where('userName', '==', currentUserState.name)
        .where('dateKey', '==', dateKey)
        .get();

      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.type === 'MASUK') {
          todayLogCache.masuk = data;
          document.getElementById('btnSubmitMasuk').disabled = true;
          document.getElementById('btnSubmitMasuk').innerText = "Sudah Absen Masuk";
        }
        if (data.type === 'PULANG') {
          todayLogCache.pulang = data;
          document.getElementById('btnSubmitPulang').disabled = true;
          document.getElementById('btnSubmitPulang').innerText = "Sudah Absen Pulang";
        }
      });
    }

    async function handleAbsenMasuk(e) {
      e.preventDefault();
      const img = document.getElementById('imgPreviewMasuk');
      if (img.classList.contains('hidden')) return alert('Wajib ambil foto!');

      const now = new Date();
      const statusType = document.getElementById('selectStatusMasuk').value;
      let finalStatus = (statusType === 'Masuk' && (now.getHours() > 8 || (now.getHours() === 8 && now.getMinutes() > 0))) ? 'Terlambat' : 'Tepat Waktu';

      const newLog = {
        dateKey: now.toISOString().split('T')[0],
        time: now.toLocaleString('id-ID'),
        userName: currentUserState.name,
        type: 'MASUK',
        status: finalStatus,
        photo: img.src,
        laporan: '-',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection('absen_logs').add(newLog);
      alert('Absen Masuk Berhasil Disimpan ke Cloud!');
      checkTodayStatus();
    }

    async function handleAbsenPulang(e) {
      e.preventDefault();
      if (!todayLogCache.masuk) return alert('Belum absen masuk hari ini!');
      const img = document.getElementById('imgPreviewPulang');
      if (img.classList.contains('hidden')) return alert('Wajib ambil foto!');

      const now = new Date();
      const newLog = {
        dateKey: now.toISOString().split('T')[0],
        time: now.toLocaleString('id-ID'),
        userName: currentUserState.name,
        type: 'PULANG',
        status: 'Pulang',
        photo: img.src,
        laporan: document.getElementById('inputLaporanTugas').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection('absen_logs').add(newLog);
      alert('Absen Pulang Berhasil Disimpan ke Cloud!');
      checkTodayStatus();
    }

    function subscribeRealtimeHrdLogs() {
      db.collection('absen_logs').orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          const tbody = document.getElementById('hrdLogTableBody');
          tbody.innerHTML = '';
          
          if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data presensi.</td></tr>`;
            return;
          }

          snapshot.forEach((doc) => {
            const log = doc.data();
            let statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-700">${log.status}</span>`;
            if (log.status === 'Terlambat') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">Terlambat</span>`;
            if (log.status === 'Tepat Waktu') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">Tepat Waktu</span>`;

            tbody.innerHTML += `
              <tr class="hover:bg-slate-50 border-b border-slate-100">
                <td class="p-3 font-mono text-slate-500">${log.time || '-'}</td>
                <td class="p-3 font-bold text-slate-900">${log.userName}</td>
                <td class="p-3 font-bold ${log.type === 'MASUK' ? 'text-red-600' : 'text-slate-800'}">${log.type}</td>
                <td class="p-3">${statusBadge}</td>
                <td class="p-3 text-slate-600 max-w-xs truncate">${log.laporan}</td>
                <td class="p-3 text-center">
                  <button onclick="openModalFoto('${log.photo}')" class="text-red-600 font-semibold hover:underline flex items-center justify-center space-x-1 mx-auto">
                    <i data-lucide="image" class="w-3.5 h-3.5"></i>
                    <span>Foto</span>
                  </button>
                </td>
              </tr>
            `;
          });
          lucide.createIcons();
        });
    }

    function openModalFoto(src) {
      document.getElementById('modalFotoImg').src = src;
      document.getElementById('modalFoto').classList.remove('hidden');
    }
    function closeModalFoto() {
      document.getElementById('modalFoto').classList.add('hidden');
    }
  </script>
</body>
</html>
